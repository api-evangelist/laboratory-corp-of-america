description: >-
  Laboratory Corporation of America Holdings, doing business as Labcorp, is a leading
  global life sciences company providing diagnostic, drug development, and
  technology-enabled solutions to improve health and lives. This repository is an
  alias of the labcorp index and tracks the same FHIR / HL7 integration surface.
apis:
  - aid: laboratory-corp-of-america:labcorp-fhir-api
    name: Labcorp FHIR API
    tags:
      - FHIR
      - HL7
      - Healthcare
      - Interoperability
      - Laboratory
    humanURL: https://www.labcorp.com/organizations/health-systems
    description: >-
      Labcorp supports HL7 FHIR-based exchange of laboratory orders, results, and
      diagnostic reports with provider and health-system EHR systems. Typical FHIR
      resources exposed include ServiceRequest, DiagnosticReport, Observation,
      Patient, Practitioner, Specimen, and Organization. Access is provisioned
      through Labcorp integration services.
