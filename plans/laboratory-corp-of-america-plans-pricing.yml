specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Laboratory Corporation of America (Labcorp)
providerId: laboratory-corp-of-america
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Healthcare
  - FHIR
  - HL7
  - Diagnostics
  - Laboratory
  - Alias
description: This repository is an alias of the labcorp index — same connectivity surface, same lack
  of public commercial pricing. Access to Labcorp's HL7 v2 / FHIR exchange is contract-driven through
  the connectivity-solutions team or a biopharma master agreement; no per-call pricing is published.
sources:
  - https://www.labcorp.com/
notes: Alias of the labcorp provider; pricing artifact mirrors the labcorp record. No public price list
  exists; integrations are bundled into the broader laboratory-services agreement.
plans:
  - id: laboratory-corp-of-america-ehr-connectivity
    name: EHR / Health-System Connectivity
    type: enterprise
    description: HL7 v2 / FHIR-based connectivity for laboratory orders and results exchange, negotiated
      under a health-system or EHR-vendor connectivity agreement. No per-call pricing.
    entries:
      - label: Connectivity agreement
        name: ehr_connectivity
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: US
        unit: 1
        price: contact provider
        userMultiplied: false
    elements:
      - name: HL7 v2 ORM / ORU messages
      - name: FHIR R4 lab order / result exchange
      - name: Patient identity matching
      - name: Result delivery to EHR inbox
  - id: laboratory-corp-of-america-biopharma
    name: Biopharma / CRO Integration
    type: enterprise
    description: Programmatic data exchange tied to Labcorp's drug-development services. Governed by
      the master service agreement; no per-call pricing.
    entries:
      - label: Biopharma MSA
        name: biopharma_msa
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact provider
        userMultiplied: false
    elements:
      - name: Clinical-trial data exchange
      - name: Sample tracking and chain-of-custody
      - name: Tabulated result delivery
maintainers:
